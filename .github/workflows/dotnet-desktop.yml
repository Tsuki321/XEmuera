# This workflow builds and packages the XEmuera Xamarin Android application.
#
# For more information on GitHub Actions, refer to https://github.com/features/actions
#
# For release signing, add the following secrets to the repository:
#   KEYSTORE_BASE64        - Base64-encoded keystore file (.jks/.keystore)
#   KEY_STORE_PASSWORD     - Password for the keystore
#   KEY_ALIAS              - Key alias inside the keystore
#   KEY_PASSWORD           - Password for the key

name: .NET Core Desktop

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:

    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest

    env:
      Solution_Name: XEmuera.sln
      Android_Project_Path: XEmuera\XEmuera.Android\XEmuera.Android.csproj
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Install the .NET Core workload
    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    # Add MSBuild to the PATH: https://github.com/microsoft/setup-msbuild
    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v2

    # Install Android SDK platform 31 required by TargetFrameworkVersion v12.0
    - name: Install Android SDK Platform 31
      run: |
        $sdkmanager = "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat"
        if (-not (Test-Path $sdkmanager)) {
          Write-Error "sdkmanager not found at $sdkmanager. ANDROID_HOME=$env:ANDROID_HOME"
          exit 1
        }
        echo "y" | & $sdkmanager "platforms;android-31"
      shell: pwsh

    # Decode the keystore for release signing (requires KEYSTORE_BASE64 secret)
    - name: Decode keystore for signing
      if: matrix.configuration == 'Release' && env.KEYSTORE_BASE64 != ''
      run: |
        $keystoreBytes = [Convert]::FromBase64String("$env:KEYSTORE_BASE64")
        [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\xemuera.keystore", $keystoreBytes)
      shell: pwsh

    # Restore the application to populate the obj folder with RuntimeIdentifiers
    - name: Restore the application
      run: msbuild $env:Solution_Name /t:Restore /p:Configuration=$env:Configuration
      env:
        Configuration: ${{ matrix.configuration }}

    # Build the Android project (unsigned) when no keystore is available
    - name: Build the Android project (unsigned)
      if: matrix.configuration == 'Debug' || env.KEYSTORE_BASE64 == ''
      run: msbuild $env:Android_Project_Path /t:PackageForAndroid /p:Configuration=$env:Configuration
      env:
        Configuration: ${{ matrix.configuration }}

    # Build the Android project and generate a signed APK
    - name: Build the Android project (signed release)
      if: matrix.configuration == 'Release' && env.KEYSTORE_BASE64 != ''
      run: >
        msbuild $env:Android_Project_Path /t:SignAndroidPackage
        /p:Configuration=$env:Configuration
        /p:AndroidKeyStore=true
        /p:AndroidSigningKeyStore="$env:RUNNER_TEMP\xemuera.keystore"
        /p:AndroidSigningStorePass="$env:KEY_STORE_PASSWORD"
        /p:AndroidSigningKeyAlias="$env:KEY_ALIAS"
        /p:AndroidSigningKeyPass="$env:KEY_PASSWORD"
      env:
        Configuration: ${{ matrix.configuration }}
        KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    # Upload the signed APK: https://github.com/marketplace/actions/upload-a-build-artifact
    - name: Upload build artifacts (signed release)
      if: matrix.configuration == 'Release' && env.KEYSTORE_BASE64 != ''
      uses: actions/upload-artifact@v4
      with:
        name: APK-${{ matrix.configuration }}
        path: XEmuera/XEmuera.Android/bin/${{ matrix.configuration }}/*-Signed.apk

    # Upload the unsigned APK for Debug builds
    - name: Upload build artifacts (unsigned)
      if: matrix.configuration == 'Debug' || env.KEYSTORE_BASE64 == ''
      uses: actions/upload-artifact@v4
      with:
        name: APK-${{ matrix.configuration }}
        path: XEmuera/XEmuera.Android/bin/${{ matrix.configuration }}/*.apk
